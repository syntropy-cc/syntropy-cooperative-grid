# Template de configuração principal do Syntropy Manager
version: "1.0.0"
owner:
  name: "{{.OwnerName}}"
  email: "{{.OwnerEmail}}"
  key_id: "{{.OwnerKeyID}}"
network:
  discovery:
    enabled: true
    port: 8080
  api:
    enabled: true
    port: 9090
    tls:
      enabled: true
      cert_path: "{{.CertPath}}"
      key_path: "{{.KeyPath}}"
security:
  encryption:
    algorithm: "ed25519"
    key_rotation:
      enabled: true
      interval: "30d"
  backup:
    enabled: true
    interval: "24h"
    retention: "30d"
logging:
  level: "info"
  format: "json"
  output: "file"
  file_path: "{{.LogPath}}"
  rotation:
    enabled: true
    max_size: "100MB"
    max_age: "7d"
    max_backups: 10
iso:
  custom_urls:
    - "https://releases.ubuntu.com/24.04.3/ubuntu-24.04.3-live-server-amd64.iso?_gl=1*12y79vf*_gcl_au*MTAzMzgyNzE0NC4xNzU5NDIzNDAz"
  preferred_mirrors:
    - "https://releases.ubuntu.com"
    - "https://mirror.math.princeton.edu/pub/ubuntu-iso"
    - "https://mirrors.kernel.org/ubuntu-iso"
    - "https://mirror.umd.edu/ubuntu-iso"
  enable_auto_fallback: true
  max_retries: 3
  timeout: "30m"
