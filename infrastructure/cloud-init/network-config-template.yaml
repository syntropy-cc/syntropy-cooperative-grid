# Syntropy Cooperative Grid - Network Configuration (MVP)
# Simplified DHCP-only configuration for automatic network setup

version: 2
ethernets:
  en*:
    dhcp4: true
    dhcp6: false
    nameservers:
      addresses: [8.8.8.8, 8.8.4.4, 1.1.1.1]
  
  eth*:
    dhcp4: true
    dhcp6: false
    nameservers:
      addresses: [8.8.8.8, 8.8.4.4, 1.1.1.1]
  
  enp*:
    dhcp4: true
    dhcp6: false
    nameservers:
      addresses: [8.8.8.8, 8.8.4.4, 1.1.1.1]