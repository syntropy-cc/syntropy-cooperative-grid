#cloud-config

# 1. SYSTEM SETUP
locale: en_US.UTF-8
timezone: UTC
hostname: {{ .NodeID }}

# 2. USER CONFIGURATION
users:
  - name: syntropy
    groups: [adm, sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - {{ .SSHPublicKey }}

# 3. SSH HARDENING
ssh_pwauth: false
disable_root: true

# 4. PACKAGES
packages:
  - curl
  - wget
  - jq
  - ca-certificates
  - net-tools
  - netcat-openbsd
  - docker.io
  - docker-compose-plugin
  - openssh-server

# 5. RUNCMD (sequencial, crítico!)
runcmd:
  # Docker setup
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker syntropy
  
  # Directories
  - mkdir -p /opt/syntropy/{bin,config,logs,data,workloads}
  - chown -R syntropy:syntropy /opt/syntropy
  - chmod 755 /opt/syntropy/{bin,logs,data,workloads}
  - chmod 700 /opt/syntropy/config
  
  # SSH directory
  - mkdir -p /home/syntropy/.ssh
  - chmod 700 /home/syntropy/.ssh
  - chown syntropy:syntropy /home/syntropy/.ssh
  
  # Config files (CRITICAL - credentials!)
  - echo '{{ .NodeID }}' > /opt/syntropy/config/node_id
  - echo '{{ .GridToken }}' > /opt/syntropy/config/grid_token
  - echo '{{ .CommandStationIP }}' > /opt/syntropy/config/command_station_ip
  - echo '{{ .NodeCertificate }}' > /opt/syntropy/config/node_certificate.pem
  
  # Secure permissions
  - chmod 600 /opt/syntropy/config/grid_token
  - chmod 600 /opt/syntropy/config/node_certificate.pem
  - chown -R syntropy:syntropy /opt/syntropy/config
  
  # SSH key
  - echo '{{ .SSHPublicKey }}' > /home/syntropy/.ssh/authorized_keys
  - chmod 600 /home/syntropy/.ssh/authorized_keys
  - chown syntropy:syntropy /home/syntropy/.ssh/authorized_keys

# 6. WRITE_FILES (scripts bash)
write_files:
  - path: /opt/syntropy/bin/register.sh
    permissions: '0755'
    owner: syntropy:syntropy
    content: |
      #!/bin/bash
      set -e
      NODE_ID=$(cat /opt/syntropy/config/node_id)
      GRID_TOKEN=$(cat /opt/syntropy/config/grid_token)
      COMMAND_STATION_IP=$(cat /opt/syntropy/config/command_station_ip)
      NODE_CERT=$(cat /opt/syntropy/config/node_certificate.pem | tr -d '\n')
      
      CPU_CORES=$(nproc)
      MEMORY_GB=$(free -g | awk '/^Mem:/{print $2}')
      DISK_GB=$(df -BG / | awk 'NR==2{print $2}' | tr -d 'G')
      HOSTNAME=$(hostname)
      IP_ADDRESS=$(hostname -I | awk '{print $1}')
      OS_VERSION="Ubuntu 24.04"
      KERNEL_VERSION=$(uname -r)
      TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      
      JSON=$(cat <<EOF
      {"type":"node_announcement","node_id":"$NODE_ID","grid_token":"$GRID_TOKEN","node_certificate":"$NODE_CERT","hardware":{"cpu_cores":$CPU_CORES,"memory_gb":$MEMORY_GB,"disk_gb":$DISK_GB,"hostname":"$HOSTNAME","ip_address":"$IP_ADDRESS","os_version":"$OS_VERSION","kernel_version":"$KERNEL_VERSION"},"timestamp":"$TIMESTAMP"}
      EOF
      )
      
      echo "$JSON" | nc -w 30 $COMMAND_STATION_IP 51000
  
  - path: /opt/syntropy/bin/heartbeat.sh
    permissions: '0755'
    owner: syntropy:syntropy
    content: |
      #!/bin/bash
      NODE_ID=$(cat /opt/syntropy/config/node_id)
      COMMAND_STATION_IP=$(cat /opt/syntropy/config/command_station_ip)
      
      while true; do
        CPU_USAGE=$(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | tr -d '%' | cut -d'.' -f1)
        MEMORY_USAGE=$(free | awk '/Mem/{printf "%d", ($3/$2)*100}')
        DISK_USAGE=$(df / | awk 'NR==2{print $5}' | tr -d '%')
        UPTIME=$(cat /proc/uptime | awk '{print $1}')
        WORKLOAD_COUNT=$(docker ps -q 2>/dev/null | wc -l)
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        
        JSON=$(cat <<EOF
      {"type":"heartbeat","node_id":"$NODE_ID","timestamp":"$TIMESTAMP","metrics":{"cpu_usage":$CPU_USAGE,"memory_usage":$MEMORY_USAGE,"disk_usage":$DISK_USAGE,"uptime":$UPTIME,"workload_count":$WORKLOAD_COUNT}}
      EOF
      )
        
        echo "$JSON" | nc -w 10 $COMMAND_STATION_IP 51000
        sleep 30
      done
  
  - path: /etc/systemd/system/syntropy-register.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Syntropy Node Registration
      After=network-online.target docker.service
      Wants=network-online.target
      
      [Service]
      Type=oneshot
      User=syntropy
      Group=syntropy
      ExecStart=/opt/syntropy/bin/register.sh
      RemainAfterExit=yes
      StandardOutput=journal
      StandardError=journal
      
      [Install]
      WantedBy=multi-user.target
  
  - path: /etc/systemd/system/syntropy-heartbeat.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Syntropy Node Heartbeat
      After=syntropy-register.service
      Requires=syntropy-register.service
      
      [Service]
      Type=simple
      User=syntropy
      Group=syntropy
      ExecStart=/opt/syntropy/bin/heartbeat.sh
      Restart=always
      RestartSec=10
      StandardOutput=journal
      StandardError=journal
      
      [Install]
      WantedBy=multi-user.target

# 7. FINAL COMMANDS
runcmd:
  - systemctl daemon-reload
  - systemctl enable syntropy-register.service
  - systemctl enable syntropy-heartbeat.service
  - systemctl start syntropy-register.service
  - systemctl start syntropy-heartbeat.service

# 8. FINAL MESSAGE
final_message: "Syntropy node {{ .NodeID }} configured successfully. System ready for workloads."